name: Validate public skill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate skill structure and public release hygiene
        shell: bash
        run: |
          set -euo pipefail

          test -f assignment-check/SKILL.md
          test -f assignment-check/references/checking-protocol.md
          test -f README.md
          test -f README.en.md
          test -f LICENSE
          test -f assets/hero.webp

          grep -q '^name: assignment-check$' assignment-check/SKILL.md
          grep -q '^description:' assignment-check/SKILL.md
          grep -q '^license: MIT$' assignment-check/SKILL.md
          grep -q '^compatibility:' assignment-check/SKILL.md

          skill_version="$(sed -n 's/^  version: "\([^"]*\)"$/\1/p' assignment-check/SKILL.md | head -n 1)"
          test -n "$skill_version"

          fixture_count="$(find evals/fixtures -mindepth 1 -maxdepth 1 -type d -name 'T*' | wc -l | tr -d ' ')"
          test "$fixture_count" = "20"

          missing=0
          while IFS= read -r dir; do
            if [ ! -f "$dir/expected.md" ]; then
              echo "Missing expected.md: $dir"
              missing=1
            fi
          done < <(find evals/fixtures -mindepth 1 -maxdepth 1 -type d -name 'T*' | sort)
          test "$missing" = "0"

          test -f evals/fixtures/T14-unsafe-code/submission/cleanup.py.txt
          test ! -e evals/fixtures/T14-unsafe-code/submission/cleanup.py
          test ! -e assets/hero.svg

          grep -q 'assets/hero.webp' README.md
          grep -q 'assets/hero.webp' README.en.md
          grep -q 'README.en.md' README.md
          grep -q 'README.md' README.en.md
          grep -q 'License-MIT' README.md
          grep -q "Version-${skill_version}-" README.md
          grep -q "Version-${skill_version}-" README.en.md
          grep -q 'Evals-T1' README.md

          grep -q '`SUBMISSION INTEGRITY`' assignment-check/SKILL.md
          grep -q '`GENERAL ADVICE`' assignment-check/SKILL.md
          grep -q '`NEEDS REVISION`' assignment-check/SKILL.md
          if grep -Eq 'SUBMISSION_INTEGRITY|GENERAL_ADVICE|NEEDS_REVISION' assignment-check/SKILL.md; then
            echo "Found non-canonical internal status/source token."
            exit 1
          fi

          install_cmd='npx skills add https://github.com/henryyu333/assignment-check --skill assignment-check'
          grep -Fq "$install_cmd" README.md
          grep -Fq "$install_cmd" README.en.md

          if git grep -n -e 'houyuchan33-del' -- ':!'.github/workflows/validate.yml; then
            echo "Found stale former username."
            exit 1
          fi

          if git grep -n -e '/Users/' -- ':!'.github/workflows/validate.yml; then
            echo "Found local absolute path."
            exit 1
          fi

          if git ls-files | grep -Eq '(^|/)\.DS_Store$'; then
            echo "Found tracked .DS_Store."
            exit 1
          fi

          echo "Public skill validation passed."
